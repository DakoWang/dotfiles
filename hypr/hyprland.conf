
# #######################################################################################
# AUTOGENERATED HYPRLAND CONFIG.
# PLEASE USE THE CONFIG PROVIDED IN THE GIT REPO /examples/hyprland.conf AND EDIT IT,
# OR EDIT THIS ONE ACCORDING TO THE WIKI INSTRUCTIONS.
# #######################################################################################

#autogenerated = 1 # remove this line to remove the warning

# This is an example Hyprland config file.
# Refer to the wiki for more information.
# https://wiki.hyprland.org/Configuring/

# Please note not all available settings / options are set here.
# For a full list, see the wiki

# You can split this configuration into multiple files
# Create your files separately and then link them to this file like this:
# source = ~/.config/hypr/myColors.conf

source = ~/.config/hypr/conf/monitor.conf
source = ~/.config/hypr/conf/programs.conf
source = ~/.config/hypr/conf/autostart.conf
source = ~/.config/hypr/conf/environment.conf
source = ~/.config/hypr/conf/general.conf
source = ~/.config/hypr/conf/decoration.conf
source = ~/.config/hypr/conf/animations.conf
source = ~/.config/hypr/conf/windowrule.conf
source = ~/.config/hypr/conf/keybinds.conf
source = ~/.config/hypr/plugins.conf

# Ref https://wiki.hyprland.org/Configuring/Workspace-Rules/
# "Smart gaps" / "No gaps when only"
# uncomment all if you wish to use that.
# workspace = w[tv1], gapsout:0, gapsin:0
# workspace = f[1], gapsout:0, gapsin:0
# windowrule = bordersize 0, floating:0, onworkspace:w[tv1]
# windowrule = rounding 0, floating:0, onworkspace:w[tv1]
# windowrule = bordersize 0, floating:0, onworkspace:f[1]
# windowrule = rounding 0, floating:0, onworkspace:f[1]

# See https://wiki.hyprland.org/Configuring/Dwindle-Layout/ for more
dwindle {
    pseudotile = true # Master switch for pseudotiling. Enabling is bound to mainMod + P in the keybinds section below
    preserve_split = true # You probably want this
}

# See https://wiki.hyprland.org/Configuring/Master-Layout/ for more
master {
    new_status = master
}

# https://wiki.hyprland.org/Configuring/Variables/#misc
misc {
    force_default_wallpaper = -1 # Set to 0 or 1 to disable the anime mascot wallpapers
    disable_hyprland_logo = false # If true disables the random hyprland logo / anime girl background. :(
}


#############
### INPUT ###
#############

# https://wiki.hyprland.org/Configuring/Variables/#input
input {
    kb_layout = us
    kb_variant =
    kb_model =
    kb_options =
    kb_rules =

    follow_mouse = 1

    # sensitivity = 0.5 # -1.0 - 1.0, 0 means no modification.
    accel_profile = adaptive

    touchpad {
    	disable_while_typing = false
	scroll_factor = 0.25
        natural_scroll = true
    }
}

# https://wiki.hyprland.org/Configuring/Variables/#gestures
gestures {
    # 工作区滑动相关设置
    workspace_swipe_distance = 300          # 触摸板手势的距离（像素）
    workspace_swipe_touch = false           # 启用触摸屏边缘滑动切换工作区
    workspace_swipe_invert = true           # 反转触摸板滑动方向
    workspace_swipe_touch_invert = false    # 反转触摸屏滑动方向
    workspace_swipe_min_speed_to_force = 30 # 强制切换的最小速度（像素/时间点）
    workspace_swipe_cancel_ratio = 0.15     # 滑动取消比例（保留你原来的0.15设置）
    workspace_swipe_create_new = true       # 在最后一个工作区右滑创建新工作区
    workspace_swipe_direction_lock = true   # 启用方向锁定
    workspace_swipe_direction_lock_threshold = 10 # 方向锁定激活的距离（像素）
    workspace_swipe_forever = false         # 不限制滑动到相邻工作区
    workspace_swipe_use_r = false           # 不使用r前缀查找工作区
    
    # 关闭窗口的超时设置
    close_max_timeout = 1000                # 1:1手势关闭窗口的超时（毫秒）
}

# 配置3指水平滑动切换工作区（替换旧的workspace_swipe_fingers=4设置）
gesture = 4, horizontal, workspace

# Example per-device config
# See https://wiki.hyprland.org/Configuring/Keywords/#per-device-input-configs for more
device {
    name = epic-mouse-v1
    sensitivity = -0.5
}



plugins{
    touch_gestures{
        # The default sensitivity is probably too low on tablet screens,
        # I recommend turning it up to 4.0
        sensitivity = 4.0

        # must be >= 3
        workspace_swipe_fingers = 4

        # switching workspaces by swiping from an edge, this is separate from workspace_swipe_fingers
        # and can be used at the same time
        # possible values: l, r, u, or d
        # to disable it set it to anything else
        workspace_swipe_edge = d

        # in milliseconds
        long_press_delay = 400

        # resize windows by long-pressing on window borders and gaps.
        # If general:resize_on_border is enabled, general:extend_border_grab_area is used for floating
        # windows
        resize_on_border_long_press = true

        # in pixels, the distance from the edge that is considered an edge
        edge_margin = 10

        # emulates touchpad swipes when swiping in a direction that does not trigger workspace swipe.
        # ONLY triggers when finger count is equal to workspace_swipe_fingers
        #
        # might be removed in the future in favor of event hooks
        emulate_touchpad_swipe = false

        experimental {
            # send proper cancel events to windows instead of hacky touch_up events,
            # NOT recommended as it crashed a few times, once it's stabilized I'll make it the default
            send_cancel = 0
        }
    }
}


##############################
### WINDOWS AND WORKSPACES ###
##############################

# See https://wiki.hyprland.org/Configuring/Window-Rules/ for more
# See https://wiki.hyprland.org/Configuring/Workspace-Rules/ for workspace rules

# Example windowrule
# windowrule = float,class:^(kitty)$,title:^(kitty)$

# Ignore maximize requests from apps. You'll probably like this.
windowrule = suppressevent maximize, class:.*

# Fix some dragging issues with XWayland
windowrule = nofocus,class:^$,title:^$,xwayland:1,floating:1,fullscreen:0,pinned:0

windowrulev2 = float, title:QQ
windowrulev2 = float, title:WeChat
windowrulev2 = float, title:微信
windowrulev2 = float, title:Clash Verge
windowrulev2 = float, title:图片查看器
windowrulev2 = float, title:预览
windowrulev2 = float, title:文件管理器
windowrulev2 = float, class:QQ
windowrulev2 = float, class:org.telegram.desktop
#windowrulev2 = float, class:rog-control-center
windowrulev2 = float, class:org.telegram.desktop
windowrulev2 = float, title:^(.*的聊天记录)$
windowrulev2 = float, title:rustdesk
windowrulev2 = float, title:^(Media viewer)$
windowrulev2 = fullscreen, title:^(rdesktop.*)$
windowrulev2 = float, title:^(音量控制)$
windowrulev2 = fullscreen, title:^(.*RustDesk)$
windowrulev2 = float, class:^(org.fcitx.fcitx5-config-qt)$
windowrulev2 = float, class:^(org.fcitx.fcitx5-qt6-gui-wrapper)$
xwayland {
  force_zero_scaling = true
}

env = GDK_SCALE,2
env = XCURSOR_SIZE,32

env = QT_QPA_PLATFORM,wayland;xcb
env = GTK_IM_MODULE,fcitx
env = QT_IM_MODULE,fcitx
env = XMODIFIERS,@im=fcitx
env = SDL_IM_MODULE,fcitx
env = GLFW_IM_MODULE,ibus
env = QT_IM_MODULES,wanland;fcitx;ibus
env = QT_FONT_DPI=150
